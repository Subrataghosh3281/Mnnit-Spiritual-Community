<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 500 500" width="100%" height="100%">
  <defs>
    <!-- Gradients -->
    <linearGradient id="goldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFE082" />
      <stop offset="35%" stop-color="#FFB300" />
      <stop offset="70%" stop-color="#FF8F00" />
      <stop offset="100%" stop-color="#FF6F00" />
    </linearGradient>

    <linearGradient id="saffronGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFA726" />
      <stop offset="50%" stop-color="#FF6D00" />
      <stop offset="100%" stop-color="#DD2C00" />
    </linearGradient>

    <radialGradient id="sacredAura" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#FF8F00" stop-opacity="0.4" />
      <stop offset="60%" stop-color="#FF6D00" stop-opacity="0.15" />
      <stop offset="100%" stop-color="#080D1A" stop-opacity="0" />
    </radialGradient>

    <linearGradient id="peacockBlue" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#00E5FF" />
      <stop offset="50%" stop-color="#0091EA" />
      <stop offset="100%" stop-color="#0D47A1" />
    </linearGradient>

    <linearGradient id="peacockGreen" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#76FF03" />
      <stop offset="60%" stop-color="#00C853" />
      <stop offset="100%" stop-color="#1B5E20" />
    </linearGradient>

    <!-- Filters -->
    <filter id="divineGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="6" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>

    <filter id="softShadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="4" stdDeviation="6" flood-color="#000" flood-opacity="0.6"/>
    </filter>
  </defs>

  <!-- Background Base Disc -->
  <circle cx="250" cy="250" r="236" fill="#0A0F1D" stroke="url(#goldGrad)" stroke-width="4" filter="url(#softShadow)" />
  <circle cx="250" cy="250" r="230" fill="url(#sacredAura)" />

  <!-- Outer Beaded Mala (108/36 beads) -->
  <g stroke="url(#goldGrad)" fill="#FFB300" opacity="0.85">
    <circle cx="250" cy="25" r="4.5"/>
    <circle cx="289" cy="28" r="3.5"/>
    <circle cx="327" cy="38" r="3.5"/>
    <circle cx="363" cy="55" r="3.5"/>
    <circle cx="395" cy="78" r="3.5"/>
    <circle cx="422" cy="108" r="3.5"/>
    <circle cx="443" cy="142" r="3.5"/>
    <circle cx="457" cy="180" r="3.5"/>
    <circle cx="463" cy="219" r="3.5"/>
    <circle cx="463" cy="259" r="3.5"/>
    <circle cx="455" cy="298" r="3.5"/>
    <circle cx="439" cy="335" r="3.5"/>
    <circle cx="416" cy="369" r="3.5"/>
    <circle cx="386" cy="399" r="3.5"/>
    <circle cx="351" cy="423" r="3.5"/>
    <circle cx="313" cy="441" r="3.5"/>
    <circle cx="272" cy="451" r="3.5"/>
    <circle cx="230" cy="451" r="3.5"/>
    <circle cx="189" cy="441" r="3.5"/>
    <circle cx="151" cy="423" r="3.5"/>
    <circle cx="116" cy="399" r="3.5"/>
    <circle cx="86" cy="369" r="3.5"/>
    <circle cx="63" cy="335" r="3.5"/>
    <circle cx="47" cy="298" r="3.5"/>
    <circle cx="39" cy="259" r="3.5"/>
    <circle cx="39" cy="219" r="3.5"/>
    <circle cx="45" cy="180" r="3.5"/>
    <circle cx="59" cy="142" r="3.5"/>
    <circle cx="80" cy="108" r="3.5"/>
    <circle cx="107" cy="78" r="3.5"/>
    <circle cx="139" cy="55" r="3.5"/>
    <circle cx="175" cy="38" r="3.5"/>
    <circle cx="213" cy="28" r="3.5"/>
  </g>

  <!-- Double Sacred Rings -->
  <circle cx="250" cy="250" r="218" fill="none" stroke="url(#goldGrad)" stroke-width="1.8" stroke-dasharray="4 4" />
  <circle cx="250" cy="250" r="210" fill="none" stroke="url(#goldGrad)" stroke-width="2.5" />
  <circle cx="250" cy="250" r="158" fill="none" stroke="url(#saffronGrad)" stroke-width="2" />
  <circle cx="250" cy="250" r="152" fill="none" stroke="url(#goldGrad)" stroke-width="1" stroke-dasharray="3 3" />

  <!-- Arch Text Paths -->
  <path id="topTextArc" d="M 68 250 A 182 182 0 0 1 432 250" fill="none" />
  <path id="bottomTextArc" d="M 432 250 A 182 182 0 0 1 68 250" fill="none" />

  <text font-family="'Cinzel', 'Georgia', serif" font-size="19" font-weight="700" fill="url(#goldGrad)" letter-spacing="4" filter="url(#divineGlow)">
    <textPath href="#topTextArc" startOffset="50%" text-anchor="middle">
      ANAHAD BAND • अनहद मंडली
    </textPath>
  </text>

  <text font-family="'Plus Jakarta Sans', 'Arial', sans-serif" font-size="14.5" font-weight="700" fill="#FFC107" letter-spacing="4">
    <textPath href="#bottomTextArc" startOffset="50%" text-anchor="middle">
      MNNIT ALLAHABAD • PRAYAGRAJ
    </textPath>
  </text>

  <!-- Sacred Geometry / Mandala Rays behind Center -->
  <g stroke="url(#goldGrad)" stroke-width="0.8" opacity="0.35">
    <line x1="250" y1="100" x2="250" y2="400" />
    <line x1="100" y1="250" x2="400" y2="250" />
    <line x1="144" y1="144" x2="356" y2="356" />
    <line x1="356" y1="144" x2="144" y2="356" />
    <circle cx="250" cy="250" r="125" fill="none" stroke-dasharray="2 6"/>
  </g>

  <!-- Divine Peacock Feather (Mayur Pankh) -->
  <g transform="translate(262, 130) rotate(18) scale(0.65)">
    <!-- Feather Stem -->
    <path d="M 0 160 Q -10 80 0 0 Q 10 80 0 160" fill="url(#goldGrad)"/>
    <!-- Outer Eye (Golden Glow) -->
    <ellipse cx="0" cy="25" rx="38" ry="48" fill="url(#goldGrad)" opacity="0.9"/>
    <!-- Green Plumes -->
    <ellipse cx="0" cy="25" rx="32" ry="42" fill="url(#peacockGreen)"/>
    <!-- Blue Eye -->
    <ellipse cx="0" cy="28" rx="22" ry="30" fill="url(#peacockBlue)"/>
    <!-- Inner Deep Sapphire & Pupil -->
    <ellipse cx="0" cy="32" rx="14" ry="18" fill="#0A0F24"/>
    <ellipse cx="0" cy="34" rx="8" ry="10" fill="#00E5FF"/>
    <circle cx="-2" cy="32" r="3" fill="#FFFFFF"/>
  </g>

  <!-- Divine Bansuri (Flute) across center -->
  <g transform="translate(130, 185) rotate(-14)">
    <!-- Flute Body with Gold Shading -->
    <rect x="0" y="28" width="250" height="15" rx="7.5" fill="url(#goldGrad)" stroke="#FFA000" stroke-width="1.5" filter="url(#softShadow)"/>
    
    <!-- Finger Holes -->
    <circle cx="50" cy="35.5" r="3.2" fill="#3E1A00" stroke="#FFD54F" stroke-width="1"/>
    <circle cx="75" cy="35.5" r="3.2" fill="#3E1A00" stroke="#FFD54F" stroke-width="1"/>
    <circle cx="100" cy="35.5" r="3.2" fill="#3E1A00" stroke="#FFD54F" stroke-width="1"/>
    <circle cx="125" cy="35.5" r="3.2" fill="#3E1A00" stroke="#FFD54F" stroke-width="1"/>
    <circle cx="150" cy="35.5" r="3.2" fill="#3E1A00" stroke="#FFD54F" stroke-width="1"/>
    <circle cx="175" cy="35.5" r="3.2" fill="#3E1A00" stroke="#FFD54F" stroke-width="1"/>
    <circle cx="215" cy="35.5" r="3.8" fill="#3E1A00" stroke="#FFD54F" stroke-width="1"/>

    <!-- Decorative Silk Tassels (Ghungroo/Thread) -->
    <path d="M 235 36 Q 248 55 240 75 Q 235 90 242 105" fill="none" stroke="url(#saffronGrad)" stroke-width="2.5"/>
    <circle cx="242" cy="107" r="4.5" fill="url(#goldGrad)"/>
    <path d="M 232 36 Q 225 55 228 72" fill="none" stroke="#FF8F00" stroke-width="2"/>
    <circle cx="228" cy="74" r="3.5" fill="#FFC107"/>
  </g>

  <!-- Sacred OM (ॐ) Motif in Glow -->
  <g transform="translate(250, 240) scale(1.1)" filter="url(#divineGlow)">
    <text x="0" y="0" font-family="'Tiro Devanagari Hindi', 'Rozha One', 'Georgia', serif" font-size="58" font-weight="900" fill="url(#goldGrad)" text-anchor="middle" dominant-baseline="central">
      ॐ
    </text>
  </g>

  <!-- Musical Rhythms / Soundwave Naad under OM -->
  <g transform="translate(170, 280)">
    <line x1="0" y1="12" x2="0" y2="-12" stroke="#FFB300" stroke-width="3" stroke-linecap="round"/>
    <line x1="12" y1="18" x2="12" y2="-18" stroke="#FF8F00" stroke-width="3" stroke-linecap="round"/>
    <line x1="24" y1="8" x2="24" y2="-8" stroke="#FFA726" stroke-width="3" stroke-linecap="round"/>
    <line x1="36" y1="24" x2="36" y2="-24" stroke="url(#goldGrad)" stroke-width="3.5" stroke-linecap="round"/>
    <line x1="48" y1="14" x2="48" y2="-14" stroke="#FFB300" stroke-width="3" stroke-linecap="round"/>
    <line x1="60" y1="28" x2="60" y2="-28" stroke="url(#saffronGrad)" stroke-width="4" stroke-linecap="round"/>
    <line x1="72" y1="16" x2="72" y2="-16" stroke="#FFB300" stroke-width="3" stroke-linecap="round"/>
    <line x1="84" y1="25" x2="84" y2="-25" stroke="url(#goldGrad)" stroke-width="3.5" stroke-linecap="round"/>
    <line x1="96" y1="10" x2="96" y2="-10" stroke="#FFA726" stroke-width="3" stroke-linecap="round"/>
    <line x1="108" y1="20" x2="108" y2="-20" stroke="#FF8F00" stroke-width="3" stroke-linecap="round"/>
    <line x1="120" y1="12" x2="120" y2="-12" stroke="#FFB300" stroke-width="3" stroke-linecap="round"/>
    <line x1="132" y1="26" x2="132" y2="-26" stroke="url(#saffronGrad)" stroke-width="4" stroke-linecap="round"/>
    <line x1="144" y1="14" x2="144" y2="-14" stroke="#FFB300" stroke-width="3" stroke-linecap="round"/>
    <line x1="156" y1="8" x2="156" y2="-8" stroke="#FFA726" stroke-width="3" stroke-linecap="round"/>
  </g>

  <!-- Tagline Banner Ribbon -->
  <g transform="translate(250, 335)">
    <!-- Elegant Ribbon Shape -->
    <path d="M -140 0 L 140 0 L 130 18 L 140 36 L -140 36 L -130 18 Z" fill="#121D36" stroke="url(#goldGrad)" stroke-width="1.5" filter="url(#softShadow)"/>
    <text x="0" y="24" font-family="'Plus Jakarta Sans', sans-serif" font-size="11.5" font-weight="800" fill="url(#goldGrad)" letter-spacing="2.5" text-anchor="middle">
      MUSIC • DEVOTION • CULTURE
    </text>
  </g>

  <!-- Twin Lit Diya Motif at bottom left & right -->
  <!-- Left Diya -->
  <g transform="translate(180, 395) scale(0.65)">
    <path d="M -22 10 Q 0 24 22 10 Q 0 -2 -22 10 Z" fill="#B45309" stroke="#F59E0B" stroke-width="2"/>
    <!-- Flame -->
    <path d="M 0 4 Q -10 -15 0 -35 Q 10 -15 0 4 Z" fill="url(#saffronGrad)" filter="url(#divineGlow)"/>
    <circle cx="0" cy="-12" r="5" fill="#FFE082"/>
  </g>

  <!-- Right Diya -->
  <g transform="translate(320, 395) scale(0.65)">
    <path d="M -22 10 Q 0 24 22 10 Q 0 -2 -22 10 Z" fill="#B45309" stroke="#F59E0B" stroke-width="2"/>
    <!-- Flame -->
    <path d="M 0 4 Q -10 -15 0 -35 Q 10 -15 0 4 Z" fill="url(#saffronGrad)" filter="url(#divineGlow)"/>
    <circle cx="0" cy="-12" r="5" fill="#FFE082"/>
  </g>
</svg>
